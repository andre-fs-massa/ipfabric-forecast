<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Fabric — Predictive Incident Forecasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:       #090c10;
  --bg2:      #0e1318;
  --bg3:      #141b22;
  --border:   #1e2a35;
  --border2:  #243040;
  --text:     #c8d8e8;
  --muted:    #5a7080;
  --accent:   #00c8ff;
  --accent2:  #0090cc;
  --crit:     #ff3d5a;
  --high:     #ff8c00;
  --med:      #f5c518;
  --low:      #3ecf8e;
  --font-sans: 'Syne', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow-x: hidden; }

/* scan-line overlay */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
}

/* ── HEADER ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 32px; border-bottom: 1px solid var(--border);
  background: var(--bg2); position: sticky; top: 0; z-index: 100;
}
.logo { display:flex; align-items:center; gap:12px; }
.logo-mark {
  width:32px; height:32px; border:1.5px solid var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-size:12px; color:var(--accent);
  clip-path: polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));
}
.logo-text { font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.logo-sub  { font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:.06em; margin-top:1px; }
.header-right { display:flex; align-items:center; gap:16px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--low); box-shadow:0 0 6px var(--low); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.timestamp { font-family:var(--font-mono); font-size:11px; color:var(--muted); }

/* ── LAYOUT ── */
.main { display:grid; grid-template-columns:1fr 380px; gap:0; height:calc(100vh - 57px); }
.left  { overflow-y:auto; padding:24px 28px; border-right:1px solid var(--border); }
.right { overflow-y:auto; padding:24px; background:var(--bg2); }

/* ── SECTION HEADERS ── */
.section-label {
  font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── STAT CARDS ── */
.stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:24px; }
.stat-card {
  background:var(--bg3); border:1px solid var(--border); padding:14px 16px;
  clip-path: polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
}
.stat-val { font-size:26px; font-weight:800; line-height:1; margin-bottom:4px; }
.stat-lbl { font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
.stat-card.crit .stat-val { color:var(--crit); }
.stat-card.high .stat-val { color:var(--high); }
.stat-card.health .stat-val { color:var(--accent); }
.stat-card.total .stat-val { color:var(--text); }

/* ── DEVICE GRID ── */
.device-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-bottom:24px; }
.device-card {
  background:var(--bg3); border:1px solid var(--border); padding:14px;
  cursor:pointer; transition:border-color .2s, transform .1s;
  clip-path: polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);
  position:relative; overflow:hidden;
}
.device-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
}
.device-card.risk-critical::before { background:var(--crit); box-shadow:0 0 8px var(--crit); }
.device-card.risk-high::before    { background:var(--high); box-shadow:0 0 8px var(--high); }
.device-card.risk-medium::before  { background:var(--med);  box-shadow:0 0 6px var(--med); }
.device-card.risk-low::before     { background:var(--low);  }
.device-card:hover { border-color:var(--border2); transform:translateY(-1px); }
.device-card.selected { border-color:var(--accent2); }

.device-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
.device-name { font-size:13px; font-weight:700; }
.device-meta { font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-top:2px; }
.risk-badge {
  font-family:var(--font-mono); font-size:9px; font-weight:500; letter-spacing:.08em;
  padding:3px 7px; border-radius:2px; text-transform:uppercase;
}
.rb-critical { background:rgba(255,61,90,.15); color:var(--crit); border:1px solid rgba(255,61,90,.3); }
.rb-high     { background:rgba(255,140,0,.12); color:var(--high); border:1px solid rgba(255,140,0,.25); }
.rb-medium   { background:rgba(245,197,24,.1);  color:var(--med);  border:1px solid rgba(245,197,24,.2); }
.rb-low      { background:rgba(62,207,142,.1);  color:var(--low);  border:1px solid rgba(62,207,142,.2); }
.rb-unknown  { background:rgba(90,112,128,.1);  color:var(--muted);border:1px solid var(--border); }

.mini-metrics { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.mini-m { font-family:var(--font-mono); font-size:10px; }
.mini-m .mv { color:var(--text); font-weight:500; }
.mini-m .ml { color:var(--muted); }

/* ── SCAN BUTTON ── */
.scan-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:14px; margin-bottom:24px;
  background:transparent; border:1px solid var(--accent); color:var(--accent);
  font-family:var(--font-sans); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer; transition:background .2s, box-shadow .2s;
  clip-path: polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
}
.scan-btn:hover:not(:disabled) { background:rgba(0,200,255,.08); box-shadow:0 0 20px rgba(0,200,255,.15); }
.scan-btn:disabled { opacity:.4; cursor:not-allowed; }
.scan-icon { width:16px; height:16px; }
.scanning .scan-icon { animation: spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── RIGHT PANEL ── */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:300px; gap:12px; color:var(--muted); text-align:center;
}
.empty-state .big-icon { font-size:40px; opacity:.3; }
.empty-state p { font-size:13px; line-height:1.6; max-width:240px; }

/* ── FORECAST PANEL ── */
.forecast-summary {
  background:var(--bg3); border:1px solid var(--border); padding:16px; margin-bottom:16px;
  font-size:13px; line-height:1.7; color:var(--text);
  clip-path: polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
}
.forecast-summary strong { color:var(--accent); }

.risk-list { display:flex; flex-direction:column; gap:8px; }
.risk-item {
  background:var(--bg3); border:1px solid var(--border); padding:14px;
  cursor:pointer; transition:border-color .15s;
  clip-path: polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);
}
.risk-item:hover { border-color:var(--border2); }
.risk-item.active { border-color:var(--accent2); }

.ri-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.ri-name { font-size:12px; font-weight:700; }
.ri-score-wrap { display:flex; align-items:center; gap:8px; }
.ri-score { font-family:var(--font-mono); font-size:11px; color:var(--muted); }
.ri-days  { font-family:var(--font-mono); font-size:10px; padding:2px 6px; border-radius:2px; }
.days-crit { background:rgba(255,61,90,.15); color:var(--crit); }
.days-high { background:rgba(255,140,0,.12); color:var(--high); }
.days-med  { background:rgba(245,197,24,.1);  color:var(--med); }

.ri-bar-bg  { height:3px; background:var(--border); border-radius:2px; margin-bottom:8px; }
.ri-bar     { height:3px; border-radius:2px; transition:width .6s ease; }
.bar-crit   { background:var(--crit); box-shadow:0 0 6px var(--crit); }
.bar-high   { background:var(--high); box-shadow:0 0 4px var(--high); }
.bar-med    { background:var(--med); }
.bar-low    { background:var(--low); }

.ri-signal { font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-bottom:4px; }
.ri-detail { font-size:11px; color:var(--muted); line-height:1.55; display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
.ri-detail.open { display:block; }
.ri-action { margin-top:6px; font-size:11px; color:var(--accent); }

/* ── DETAIL MODAL / CHART PANEL ── */
.chart-panel { margin-top:16px; }
.chart-wrap {
  background:var(--bg3); border:1px solid var(--border); padding:16px; margin-bottom:10px;
  clip-path: polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);
}
.chart-title { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:10px; }

/* ── LOADING OVERLAY ── */
.overlay {
  position:fixed; inset:0; background:rgba(9,12,16,.85);
  display:none; flex-direction:column; align-items:center; justify-content:center; z-index:500;
  gap:16px; backdrop-filter:blur(4px);
}
.overlay.show { display:flex; }
.loader-ring {
  width:52px; height:52px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite;
}
.loader-text { font-family:var(--font-mono); font-size:12px; color:var(--muted); letter-spacing:.1em; }

/* scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

@media (max-width:900px) {
  .main { grid-template-columns:1fr; height:auto; }
  .right { border-top:1px solid var(--border); }
  .stat-row { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="loader-ring"></div>
  <div class="loader-text" id="overlay-msg">INITIALISING SNAPSHOT…</div>
</div>

<header class="header">
  <div class="logo">
    <div class="logo-mark">IPF</div>
    <div>
      <div class="logo-text">IP Fabric</div>
      <div class="logo-sub">Predictive Incident Forecasting</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot" id="status-dot"></div>
    <div class="timestamp" id="ts">—</div>
  </div>
</header>

<div class="main">

  <!-- LEFT: device grid -->
  <div class="left">
    <div class="section-label">Network snapshot</div>

    <div class="stat-row" id="stat-row">
      <div class="stat-card total"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Devices</div></div>
      <div class="stat-card crit"> <div class="stat-val" id="s-crit">—</div><div class="stat-lbl">Critical</div></div>
      <div class="stat-card high"> <div class="stat-val" id="s-high">—</div><div class="stat-lbl">High risk</div></div>
      <div class="stat-card health"><div class="stat-val" id="s-health">—</div><div class="stat-lbl">Health score</div></div>
    </div>

    <button class="scan-btn" id="scan-btn" onclick="runForecast()">
      <svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      Run AI Forecast
    </button>

    <div class="section-label">Devices</div>
    <div class="device-grid" id="device-grid">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- RIGHT: forecast results -->
  <div class="right">
    <div class="section-label">AI Risk Forecast</div>
    <div id="right-content">
      <div class="empty-state">
        <div class="big-icon">◈</div>
        <p>Click <strong>Run AI Forecast</strong> to analyse the current network snapshot and generate a predictive risk report.</p>
      </div>
    </div>
  </div>

</div>

<script>
let snapshot = null;
let forecastData = null;
let charts = {};

// ── Utility ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const riskColor = r => ({ critical:'var(--crit)', high:'var(--high)', medium:'var(--med)', low:'var(--low)' }[r] || 'var(--muted)');
const riskBarClass = r => ({ critical:'bar-crit', high:'bar-high', medium:'bar-med', low:'bar-low' }[r] || 'bar-low');
const badgeClass = r => ({ critical:'rb-critical', high:'rb-high', medium:'rb-medium', low:'rb-low' }[r] || 'rb-unknown');
const daysClass  = r => ({ critical:'days-crit', high:'days-high', medium:'days-med' }[r] || '');

function overlay(show, msg='') {
  $('overlay').classList.toggle('show', show);
  if (msg) $('overlay-msg').textContent = msg;
}

function updateTimestamp() {
  $('ts').textContent = new Date().toLocaleTimeString('en-GB', {hour12:false}) + ' UTC';
}
setInterval(updateTimestamp, 1000);
updateTimestamp();

// ── Load Snapshot ─────────────────────────────────────────────────────────
async function loadSnapshot() {
  overlay(true, 'LOADING NETWORK SNAPSHOT…');
  try {
    const r = await fetch('/api/snapshot');
    snapshot = await r.json();
    renderDeviceGrid();
    $('s-total').textContent = snapshot.devices.length;
  } catch(e) {
    console.error(e);
  } finally {
    overlay(false);
  }
}

function renderDeviceGrid() {
  const grid = $('device-grid');
  grid.innerHTML = '';
  snapshot.devices.forEach(dev => {
    const fc = forecastData?.risk_forecast?.find(f => f.device_id === dev.id);
    const risk = fc?.risk_level || 'unknown';
    const card = document.createElement('div');
    card.className = `device-card risk-${risk}`;
    card.id = `card-${dev.id}`;
    card.onclick = () => selectDevice(dev.id);
    card.innerHTML = `
      <div class="device-head">
        <div>
          <div class="device-name">${dev.name}</div>
          <div class="device-meta">${dev.vendor} · ${dev.location}</div>
        </div>
        <span class="risk-badge ${badgeClass(risk)}">${risk}</span>
      </div>
      <div class="mini-metrics">
        <div class="mini-m"><span class="mv">${dev.metrics.cpu.current}%</span> <span class="ml">CPU</span></div>
        <div class="mini-m"><span class="mv">${dev.metrics.errors.current}/min</span> <span class="ml">Errors</span></div>
        <div class="mini-m"><span class="mv">${dev.metrics.latency.current}ms</span> <span class="ml">Latency</span></div>
        <div class="mini-m"><span class="mv">${dev.metrics.uptime_drops.current}</span> <span class="ml">Drops</span></div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── Run Forecast ──────────────────────────────────────────────────────────
async function runForecast() {
  const btn = $('scan-btn');
  btn.disabled = true;
  btn.classList.add('scanning');
  overlay(true, 'SENDING TELEMETRY TO CLAUDE AI…');

  try {
    overlay(true, 'ANALYSING TREND PATTERNS…');
    await new Promise(r => setTimeout(r, 800));
    overlay(true, 'GENERATING RISK FORECAST…');

    const res = await fetch('/api/forecast', { method:'POST' });
    if (!res.ok) throw new Error(await res.text());
    forecastData = await res.json();

    renderDeviceGrid();
    renderForecast();
    updateStats();
  } catch(e) {
    alert('Forecast failed: ' + e.message);
  } finally {
    overlay(false);
    btn.disabled = false;
    btn.classList.remove('scanning');
  }
}

function updateStats() {
  if (!forecastData) return;
  $('s-crit').textContent   = forecastData.critical_count ?? 0;
  $('s-high').textContent   = forecastData.high_count ?? 0;
  $('s-health').textContent = (forecastData.network_health_score ?? '—') + (forecastData.network_health_score != null ? '%' : '');
}

// ── Render Forecast Panel ─────────────────────────────────────────────────
function renderForecast() {
  if (!forecastData) return;
  const rc = $('right-content');

  const summaryHtml = `
    <div class="forecast-summary">${forecastData.summary.replace(/\b(critical|high.risk|degrading|risk)\b/gi, '<strong>$1</strong>')}</div>
    <div class="section-label" style="margin-top:16px">Ranked risk forecast</div>
    <div class="risk-list" id="risk-list"></div>
  `;
  rc.innerHTML = summaryHtml;

  const list = $('risk-list');
  forecastData.risk_forecast.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = `risk-item`;
    div.id = `ri-${item.device_id}`;
    const daysHtml = item.days_to_incident
      ? `<span class="ri-days ${daysClass(item.risk_level)}">~${item.days_to_incident}d</span>`
      : '';
    div.innerHTML = `
      <div class="ri-head">
        <span class="ri-name">${item.device_name}</span>
        <div class="ri-score-wrap">
          ${daysHtml}
          <span class="risk-badge ${badgeClass(item.risk_level)}">${item.risk_level}</span>
        </div>
      </div>
      <div class="ri-bar-bg"><div class="ri-bar ${riskBarClass(item.risk_level)}" style="width:${item.risk_score}%"></div></div>
      <div class="ri-signal">↑ ${item.primary_signal}</div>
      <div class="ri-detail" id="detail-${item.device_id}">
        <p>${item.reasoning}</p>
        <p class="ri-action">→ ${item.recommended_action}</p>
      </div>
    `;
    div.onclick = () => {
      const det = $(`detail-${item.device_id}`);
      det.classList.toggle('open');
      div.classList.toggle('active');
      selectDevice(item.device_id);
    };
    list.appendChild(div);
  });
}

// ── Device Detail Charts ──────────────────────────────────────────────────
let selectedDeviceId = null;

function selectDevice(deviceId) {
  if (selectedDeviceId === deviceId) return;
  selectedDeviceId = deviceId;

  document.querySelectorAll('.device-card').forEach(c => c.classList.remove('selected'));
  const card = $(`card-${deviceId}`);
  if (card) { card.classList.add('selected'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }

  const dev = snapshot?.devices.find(d => d.id === deviceId);
  if (!dev) return;

  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  let panel = $('chart-panel');
  if (!panel) {
    const el = document.createElement('div');
    el.className = 'chart-panel'; el.id = 'chart-panel';
    $('right-content').appendChild(el);
    panel = el;
  }

  panel.innerHTML = `
    <div class="section-label" style="margin-top:4px">Device detail — ${dev.name}</div>
    <div class="chart-wrap"><div class="chart-title">CPU utilisation (%)</div><canvas id="ch-cpu" height="80"></canvas></div>
    <div class="chart-wrap"><div class="chart-title">Error rate (/min)</div><canvas id="ch-err" height="80"></canvas></div>
    <div class="chart-wrap"><div class="chart-title">Latency (ms)</div><canvas id="ch-lat" height="80"></canvas></div>
  `;

  const chartDefs = [
    { id:'ch-cpu', data:dev.metrics.cpu.history,     color:'#00c8ff' },
    { id:'ch-err', data:dev.metrics.errors.history,  color:'#ff8c00' },
    { id:'ch-lat', data:dev.metrics.latency.history, color:'#3ecf8e' },
  ];

  chartDefs.forEach(({id, data, color}) => {
    const ctx = $(id).getContext('2d');
    charts[id] = new Chart(ctx, {
      type:'line',
      data:{
        labels: dev.timestamps,
        datasets:[{ data, borderColor:color, borderWidth:1.5, pointRadius:0,
          fill:true, backgroundColor: hexToRgba(color, 0.07), tension:0.4 }]
      },
      options:{
        responsive:true, animation:{duration:600},
        plugins:{ legend:{display:false}, tooltip:{
          backgroundColor:'#141b22', borderColor:'#1e2a35', borderWidth:1,
          titleFont:{family:'IBM Plex Mono',size:10}, bodyFont:{family:'IBM Plex Mono',size:10},
          titleColor:'#5a7080', bodyColor:'#c8d8e8',
        }},
        scales:{
          x:{ grid:{color:'#1e2a35',lineWidth:.5}, ticks:{color:'#5a7080',font:{family:'IBM Plex Mono',size:9}} },
          y:{ grid:{color:'#1e2a35',lineWidth:.5}, ticks:{color:'#5a7080',font:{family:'IBM Plex Mono',size:9}} }
        }
      }
    });
  });
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Boot ──────────────────────────────────────────────────────────────────
loadSnapshot();
</script>
</body>
</html>
